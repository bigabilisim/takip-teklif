name: Codex Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/codex-sync.yml'
      - '.codex-sync-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download Codex sync package
        run: |
          set -euo pipefail
          curl -fsSL "https://takip.bigabilisim.com/public/codex-sync-v2.0.52-20260509.tar.gz" -o /tmp/codex-sync.tar.gz
          tar -xzf /tmp/codex-sync.tar.gz -C "$GITHUB_WORKSPACE"
      - name: Commit synced files
        run: |
          set -euo pipefail
          git config user.name "codex-sync"
          git config user.email "actions@github.com"
          git rm -f app/Core/PaytrClient.php || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync takip teklif v2.0.52"
            git push origin HEAD:main
          fi
